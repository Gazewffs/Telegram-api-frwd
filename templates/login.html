{% extends 'base.html' %}

{% block title %}Login - Telegram Channel Forwarder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Login</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted small">
                <p class="mb-0">Default credentials: username: <code>admin</code>, password: <code>admin</code></p>
                <p class="mb-0 text-danger">Note: Please change the default password after first login.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
