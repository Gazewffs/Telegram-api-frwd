[Auth]
# Telegram API credentials - will be set from environment variables on Render
api_id = 
api_hash = 
phone_number = 

[Channels]
# Format: channel_id:channel_name,channel_id2:channel_name2
source_channels = 
destination_channels = 

[TextFilter]
# Enable/disable text filtering (true/false)
enabled = true

# Text filter templates, format: key:value,key2:value2
# Special variables: {date}, {time}, {source_channel}, {author}
templates = source:🔰 Source: {source_channel}\nBy: {author}\nDate: {date}\nTime: {time}

# Words to replace, format: word:replacement,word2:replacement2
replacements = 

# Words to blacklist (comma-separated) - messages with these words will be skipped
blacklist = 

[MediaProcessing]
# Enable/disable media processing (true/false)
enabled = true

# Replace images with captions with a specific image
replace_captioned_images = true
replacement_image = static/images/billionaire_bot.png

[Advanced]
# Session file path
session_path = sessions/telegram_user

# Maximum message age to process (in hours)
max_message_age = 48

# Time between checking for new messages (in seconds)
check_interval = 1

# Batch size for fetching messages
batch_size = 50

# Parallel processing for multiple destination channels
parallel_destinations = true

# Enable or disable logging to database
db_logging = true