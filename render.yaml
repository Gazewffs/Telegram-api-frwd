services:
  # Web service
  - type: web
    name: telegram-forwarder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers=1 main:app
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: telegram-forwarder-db
          property: connectionString

databases:
  - name: telegram-forwarder-db
    plan: free  # Add this line
    databaseName: telegram_forwarder
    ipAllowList: []
